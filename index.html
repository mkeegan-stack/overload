he front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs and extend the hips to go back to the starting position.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xBarbell_Step_Ups","n":"Barbell Step Ups","p":"lunge","eq":"bb+bench","k":"bb","anim":"stepup","mus":"quads|calves glutes hams","lvl":1,"steps":["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck) and stand upright behind an elevated platform (such as the one used for spotting behind a flat bench). This is your starting position.","Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.","Step down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position.","Repeat with the right leg for the recommended amount of repetitions and then perform with the left leg."]},{"one":0,"id":"xBarbell_Walking_Lunge","n":"Barbell Walking Lunge","p":"lunge","eq":"bb","k":"bb","anim":"lunge","mus":"quads|calves glutes hams","lvl":0,"steps":["Begin standing with your feet shoulder width apart and a barbell across your upper back.","Step forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.","Drive through the heel of your lead foot and extend both knees to raise yourself back up.","Step forward with your rear foot, repeating the lunge on the opposite leg."]},{"one":0,"id":"xBent_Over_Two-Dumbbell_Row","n":"Bent Over Two-Dumbbell Row","p":"hpull","eq":"db","k":"db","anim":"bentRow","mus":"upback|biceps lats delts","lvl":0,"steps":["With a dumbbell in each hand (palms facing your torso), bend your knees slightly and bring your torso forward by bending at the waist; as you bend make sure to keep your back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the dumbbells to your side (as you breathe out), keeping the elbows close to the body (do not exert any force with the forearm other than holding the weights). On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xBent_Over_Two-Dumbbell_Row_With_Palms_In","n":"Bent Over Two-Dumbbell Row With Palms In","p":"hpull","eq":"db","k":"db","anim":"bentRow","mus":"upback|biceps lats","lvl":0,"steps":["With a dumbbell in each hand (palms facing each other), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the dumbbells to your side as you breathe out, squeezing your shoulder blades together. On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xBodyweight_Walking_Lunge","n":"Bodyweight Walking Lunge","p":"lunge","eq":"","k":"bw","anim":"lunge","mus":"quads|calves glutes hams","lvl":0,"steps":["Begin standing with your feet shoulder width apart and your hands on your hips.","Step forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.","Drive through the heel of your lead foot and extend both knees to raise yourself back up.","Step forward with your rear foot, repeating the lunge on the opposite leg."]},{"one":0,"id":"xBox_Squat","n":"Box Squat","p":"squat","eq":"bb","k":"bb","anim":"squatBar","mus":"quads|calves glutes hams lowback","lvl":1,"steps":["The box squat allows you to squat to desired depth and develop explosive strength in the squat movement. Begin in a power rack with a box at the appropriate height behind you. Typically, you would aim for a box height that brings you to a parallel squat, but you can train higher or lower if desired.","Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wider for more emphasis on the back, glutes, adductors, and hamstrings, or closer together for more quad development. Keep your head facing forward.","With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. Ideally, your shins should be perpendicular to the ground. Pause when you reach the box, and relax the hip flexors. Never bounce off of a box.","Keeping the weight on your heels and pushing your feet and knees out, drive upward off of the box as you lead the movement with your head. Continue upward, maintaining tightness head to toe."]},{"one":0,"id":"xButterfly","n":"Butterfly","p":"fly","eq":"mfly","k":"cable","anim":"flySeat","mus":"chest|","lvl":0,"steps":["Sit on the machine with your back flat on the pad.","Take hold of the handles. Tip: Your upper arms should be positioned parallel to the floor; adjust the machine accordingly. This will be your starting position.","Push the handles together slowly as you squeeze your chest in the middle. Breathe out during this part of the motion and hold the contraction for a second.","Return back to the starting position slowly as you inhale until your chest muscles are fully stretched.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xCable_Hammer_Curls_-_Rope_Attachment","n":"Cable Hammer Curls - Rope Attachment","p":"bi","eq":"cable","k":"cable","anim":"hammer","mus":"biceps|","lvl":0,"steps":["Attach a rope attachment to a low pulley and stand facing the machine about 12 inches away from it.","Grasp the rope with a neutral (palms-in) grip and stand straight up keeping the natural arch of the back and your torso stationary.","Put your elbows in by your side and keep them there stationary during the entire movement. Tip: Only the forearms should move; not your upper arms. This will be your starting position.","Using your biceps, pull your arms up as you exhale until your biceps touch your forearms. Tip: Remember to keep the elbows in and your upper arms stationary.","After a 1 second contraction where you squeeze your biceps, slowly start to bring the weight back to the original position.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xClose-Grip_Barbell_Bench_Press","n":"Close-Grip Barbell Bench Press","p":"hpush","eq":"bb+bench","k":"bb","anim":"bench","mus":"triceps|chest delts","lvl":0,"steps":["Lie back on a flat bench. Using a close grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that - as opposed to a regular bench press - you keep the elbows close to the torso at all times in order to maximize triceps involvement.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."]},{"one":0,"id":"xClose-Grip_EZ_Bar_Curl","n":"Close-Grip EZ Bar Curl","p":"bi","eq":"bb","k":"bb","anim":"curl","mus":"biceps|forearms","lvl":0,"steps":["Stand up with your torso upright while holding an E-Z Curl Bar at the closer inner handle. The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar. The elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xClose-Grip_Front_Lat_Pulldown","n":"Close-Grip Front Lat Pulldown","p":"vpull","eq":"mlat|cable","k":"cable","anim":"latPulldown","mus":"lats|biceps upback delts","lvl":0,"steps":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you - while holding the bar at the chosen grip width - bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary (only the arms should move). The forearms should do no other work except for holding the bar; therefore do not try to pull the bar down using the forearms.","After a second in the contracted position, while squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","6. Repeat this motion for the prescribed amount of repetitions."]},{"one":0,"id":"xDumbbell_Alternate_Bicep_Curl","n":"Dumbbell Alternate Bicep Curl","p":"bi","eq":"db","k":"db","anim":"curl","mus":"biceps|forearms","lvl":0,"steps":["Stand (torso upright) with a dumbbell in each hand held at arms length. The elbows should be close to the torso and the palms of your hand should be facing your thighs.","While holding the upper arm stationary, curl the right weight as you rotate the palm of the hands until they are facing forward. At this point continue contracting the biceps as you breathe out until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move.","Slowly begin to bring the dumbbell back to the starting position as your breathe in. Tip: Remember to twist the palms back to the starting position (facing your thighs) as you come down.","Repeat the movement with the left hand. This equals one repetition.","Continue alternating in this manner for the recommended amount of repetitions."]},{"one":0,"id":"xDumbbell_Bench_Press_with_Neutral_Grip","n":"Dumbbell Bench Press with Neutral Grip","p":"hpush","eq":"db+bench","k":"db","anim":"bench","mus":"chest|delts triceps","lvl":0,"steps":["Take a dumbbell in each hand and lay back onto a flat bench. Your feet should be flat on the floor and your shoulder blades retracted.","Maintaining a neutral grip, palms facing each other, begin with your arms extended directly above you, perpendicular to the floor. This will be your starting position.","Begin the movement by flexing the elbow, lowering the upper arms to the side. Descend until the dumbbells are to your torso.","Pause, then extend the elbow and return to the starting position."]},{"one":1,"id":"xDumbbell_One-Arm_Shoulder_Press","n":"Dumbbell One-Arm Shoulder Press","p":"vpush","eq":"db","k":"db","anim":"ohp","mus":"delts|triceps","lvl":1,"steps":["Grab a dumbbell and either sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs or stand up straight.","Clean the dumbbell up to bring it to shoulder height. The other hand can be kept fully extended to the side, by the waist or grabbing a fixed surface.","Rotate the wrist so that the palm of your hand is facing forward. This is your starting position.","As you exhale, push the dumbbell up until your arm is fully extended.","After a second pause, slowly come down back to the starting position as you inhale.","Repeat for the recommended amount of repetitions and then switch arms."]},{"one":0,"id":"xDumbbell_Rear_Lunge","n":"Dumbbell Rear Lunge","p":"lunge","eq":"db","k":"db","anim":"rlunge","mus":"quads|calves glutes hams","lvl":1,"steps":["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.","Step backward with your right leg around two feet or so from the left foot and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Tip: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground. Keep the torso upright during the lunge; flexible hip flexors are important. A long lunge emphasizes the Gluteus Maximus; a short lunge emphasizes Quadriceps.","Push up and go back to the starting position as you exhale. Tip: Use the ball of your feet to push in order to accentuate the quadriceps. To focus on the glutes, press with your heels.","Now repeat with the opposite leg."]},{"one":0,"id":"xDumbbell_Squat","n":"Dumbbell Squat","p":"squat","eq":"db","k":"db","anim":"squatDb","mus":"quads|calves glutes hams lowback","lvl":0,"steps":["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section.","Begin to slowly lower your torso by bending the knees as you maintain a straight posture with the head up. Continue down until your thighs are parallel to the floor. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise your torso as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xDumbbell_Squat_To_A_Bench","n":"Dumbbell Squat To A Bench","p":"squat","eq":"db","k":"db","anim":"squatDb","mus":"quads|calves glutes hams lowback","lvl":1,"steps":["Stand up straight with a flat bench behind you while holding a dumbbell on each hand (palms facing the side of your legs).","Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section.","Begin to slowly lower your torso by bending the knees as you maintain a straight posture with the head up. Continue down until you slightly touch the bench behind you. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xEZ-Bar_Curl","n":"EZ-Bar Curl","p":"bi","eq":"bb","k":"bb","anim":"curl","mus":"biceps|","lvl":0,"steps":["Stand up straight while holding an EZ curl bar at the wide outer handle. The palms of your hands should be facing forward and slightly tilted inward due to the shape of the bar. Keep your elbows close to your torso. This will be your starting position.","Now, while keeping your upper arms stationary, exhale and curl the weights forward while contracting the biceps. Focus on only moving your forearms.","Continue to raise the weight until your biceps are fully contracted and the bar is at shoulder level. Hold the top contracted position for a moment and squeeze the biceps.","Then inhale and slowly lower the bar back to the starting position.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xEZ-Bar_Skullcrusher","n":"EZ-Bar Skullcrusher","p":"tri","eq":"bb+bench","k":"bb","anim":"skull","mus":"triceps|forearms","lvl":0,"steps":["Using a close grip, lift the EZ bar and hold it with your elbows in as you lie on the bench. Your arms should be perpendicular to the floor. This will be your starting position.","Keeping the upper arms stationary, lower the bar by allowing the elbows to flex. Inhale as you perform this portion of the movement. Pause once the bar is directly above the forehead.","Lift the bar back to the starting position by extending the elbow and exhaling.","Repeat."]},{"one":0,"id":"xFloor_Press","n":"Floor Press","p":"hpush","eq":"bb","k":"bb","anim":"floorpress","mus":"triceps|chest delts","lvl":1,"steps":["Adjust the j-hooks so they are at the appropriate height to rack the bar. Begin lying on the floor with your head near the end of a power rack. Keeping your shoulder blades pulled together; pull the bar off of the hooks.","Lower the bar towards the bottom of your chest or upper stomach, squeezing the bar and attempting to pull it apart as you do so. Ensure that you tuck your elbows throughout the movement. Lower the bar until your upper arm contacts the ground and pause, preventing any slamming or bouncing of the weight.","Press the bar back up as fast as you can, keeping the bar, your wrists, and elbows in line as you do so."]},{"one":0,"id":"xFront_Barbell_Squat_To_A_Bench","n":"Front Barbell Squat To A Bench","p":"squat","eq":"bb","k":"bb","anim":"squatFront","mus":"quads|calves glutes hams","lvl":2,"steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set a flat bench behind you and set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, bring your arms up under the bar while keeping the elbows high and the upper arm slightly above parallel to the floor. Rest the bar on top of the deltoids and cross your arms while grasping the bar for total control.","Lift the bar off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until you touch the bench with your glutes. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor mainly with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xFull_Range-Of-Motion_Lat_Pulldown","n":"Full Range-Of-Motion Lat Pulldown","p":"vpull","eq":"mlat|cable","k":"cable","anim":"latPulldown","mus":"lats|biceps upback delts","lvl":1,"steps":["Either standing or seated on a high bench, grasp two stirrup cables that are attached to the high pulleys. Grab with the opposing hand so your arms are crisscrossed about you and your palms are facing forward.","Keeping your chest up and maintaining a slight arch in your lower back, pull the handles down as if you were doing a regular pulldown. The range of motion will be more of an arc. During the movement, rotate your hands so that in the bottom position your palms face each other rather than forward. Return slowly to the starting position and repeat."]},{"one":0,"id":"xHammer_Grip_Incline_DB_Bench_Press","n":"Hammer Grip Incline DB Bench Press","p":"ipush","eq":"db+ibench","k":"db","anim":"incline","mus":"chest|delts triceps","lvl":0,"steps":["Lie back on an incline bench with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","By using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them at shoulder width.","Once at shoulder width, keep the palms of your hands with a neutral grip (palms facing each other). Keep your elbows flared out with the upper arms in line with the shoulders (perpendicular to the torso) and the elbows bent creating a 90-degree angle between the upper arm and the forearm. This will be your starting position.","Now bring down the weights slowly to your side as you breathe in. Keep full control of the dumbbells at all times.","As you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the dumbbells back in your thighs and then on the floor. This is the safest manner to dispose of the dumbbells."]},{"one":0,"id":"xIncline_Dumbbell_Bench_With_Palms_Facing_In","n":"Incline Dumbbell Bench With Palms Facing In","p":"ipush","eq":"db+ibench","k":"db","anim":"incline","mus":"chest|delts triceps","lvl":0,"steps":["Lie back on an incline bench with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","By using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them at shoulder width.","Once at shoulder width, keep the palms of your hands with a neutral grip (palms facing each other). Keep your elbows flared out with the upper arms in line with the shoulders (perpendicular to the torso) and the elbows bent creating a 90-degree angle between the upper arm and the forearm. This will be your starting position.","Now bring down the weights slowly to your side as you breathe in. Keep full control of the dumbbells at all times.","As you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the dumbbells back in your thighs and then on the floor. This is the safest manner to dispose of the dumbbells."]},{"one":0,"id":"xIncline_Push-Up_Close-Grip","n":"Incline Push-Up Close-Grip","p":"hpush","eq":"bench","k":"bw","anim":"inclinePU","mus":"triceps|chest delts","lvl":0,"steps":["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.","Place your hands next to one another on the bar.","Position your feet back from the bar with arms and body straight. This will be your starting position.","Keeping your body straight, lower your chest to the bar by bending the arms.","Return to the starting position by extending the elbows, pressing yourself back up."]},{"one":0,"id":"xIncline_Push-Up_Wide","n":"Incline Push-Up Wide","p":"hpush","eq":"bench","k":"bw","anim":"inclinePU","mus":"chest|abs delts triceps","lvl":0,"steps":["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.","Place your hands on the bar, with your hands wider than shoulder width.","Position your feet back from the bar with arms and body straight. Your arms should be perpendicular to the body. This will be your starting position.","Keeping your body straight, lower your chest to the bar by bending the arms.","Return to the starting position by extending the elbows, pressing yourself back up."]},{"one":0,"id":"xKettlebell_One-Legged_Deadlift","n":"Kettlebell One-Legged Deadlift","p":"ham","eq":"kb","k":"kb","anim":"slrdl","mus":"hams|glutes lowback","lvl":1,"steps":["Hold a kettlebell by the handle in one hand. Stand on one leg, on the same side that you hold the kettlebell.","Keeping that knee slightly bent, perform a stiff legged deadlift by bending at the hip, extending your free leg behind you for balance.","Continue lowering the kettlebell until you are parallel to the ground, and then return to the upright position."]},{"one":0,"id":"xLeverage_Chest_Press","n":"Leverage Chest Press","p":"hpush","eq":"mchest","k":"cable","anim":"machinePress","mus":"chest|delts triceps","lvl":0,"steps":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom or middle of the pectorals at the beginning of the motion.","Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."]},{"one":0,"id":"xLeverage_Incline_Chest_Press","n":"Leverage Incline Chest Press","p":"hpush","eq":"mchest","k":"cable","anim":"machinePress","mus":"chest|delts triceps","lvl":0,"steps":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."]},{"one":0,"id":"xLow_Cable_Crossover","n":"Low Cable Crossover","p":"fly","eq":"cable","k":"cable","anim":"fly","mus":"chest|delts","lvl":0,"steps":["To move into the starting position, place the pulleys at the low position, select the resistance to be used and grasp a handle in each hand.","Step forward, gaining tension in the pulleys. Your palms should be facing forward, hands below the waist, and your arms straight. This will be your starting position.","With a slight bend in your arms, draw your hands upward and toward the midline of your body. Your hands should come together in front of your chest, palms facing up.","Return your arms back to the starting position after a brief pause."]},{"one":0,"id":"xMachine_Shoulder_Military_Press","n":"Machine Shoulder (Military) Press","p":"vpush","eq":"mshoulder","k":"cable","anim":"seatedPress","mus":"delts|triceps","lvl":0,"steps":["Sit down on the Shoulder Press Machine and select the weight.","Grab the handles to your sides as you keep the elbows bent and in line with your torso. This will be your starting position.","Now lift the handles as you exhale and you extend the arms fully. At the top of the position make sure that you hold the contraction for a second.","Lower the handles slowly back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xNarrow_Stance_Leg_Press","n":"Narrow Stance Leg Press","p":"squat","eq":"mlegpress","k":"cable","anim":"legpress","mus":"quads|calves glutes hams","lvl":1,"steps":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a less-than-shoulder-width narrow stance with the toes slightly pointed out. Your feet should be around 3 inches or less apart. Tip: Keep your head up at all times and also maintain the back on the pad at all times.","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.","Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."]},{"one":0,"id":"xNarrow_Stance_Squats","n":"Narrow Stance Squats","p":"squat","eq":"bb","k":"bb","anim":"squatBar","mus":"quads|calves glutes hams lowback","lvl":1,"steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a less-than-shoulder-width narrow stance with the toes slightly pointed out. Feet should be around 3-6 inches apart. Keep your head up at all times (looking down will get you off balance) and maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]},{"one":1,"id":"xOne-Arm_Flat_Bench_Dumbbell_Flye","n":"One-Arm Flat Bench Dumbbell Flye","p":"fly","eq":"db+bench","k":"db","anim":"flyLying","mus":"chest|","lvl":0,"steps":["Lie down on a flat bench with a dumbbell in one hand resting on top of your thigh. The palm of your hand with the dumbbell in it should be at a neutral grip.","By using your thighs to help you get the dumbbell up, clean the dumbbell so that you can hold it in front of you with your lifting arm being fully extended. Remember to maintain a neutral grip with this exercise. Your non lifting hand should be to the side holding the flat bench for better support. This will be your starting position.","Your arm with the weight should have a slight bend on your elbow in order to prevent stress at the biceps tendon. Begin by lowering your arm with the weight in it out in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, your lifting arm should remain stationary; the movement should only occur at the shoulder joint.","Return your lifting arm back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions.","Switch arms and repeat the exercise."]},{"one":1,"id":"xOne-Arm_Kettlebell_Row","n":"One-Arm Kettlebell Row","p":"hpull","eq":"kb+bench","k":"kb","anim":"dbRow","mus":"upback|biceps lats","lvl":1,"steps":["Place a kettlebell in front of your feet. Bend your knees slightly and then push your butt out as much as possible as you bend over to get in the starting position. Grab the kettlebell and pull it to your stomach, retracting your shoulder blade and flexing the elbow. Keep your back straight. Lower and repeat."]},{"one":1,"id":"xOne_Arm_Dumbbell_Bench_Press","n":"One Arm Dumbbell Bench Press","p":"hpush","eq":"db+bench","k":"db","anim":"bench","mus":"chest|delts triceps","lvl":0,"steps":["Lie down on a flat bench with a dumbbell in one hand on top of your thigh.","By using your thigh to help you get the dumbbell up, clean the dumbbell up so that you can hold it in front of you at shoulder width. Use the hand you are not lifting with to help position the dumbbell over you properly.","Once at shoulder width, rotate your wrist forward so that the palm of your hand is facing away from you. This will be your starting position.","Bring down the weights slowly to your side as you breathe in. Keep full control of the dumbbell at all times. Tip: Use the hand that you are not lifting with to help keep the dumbbell balance as you may struggle a bit at first. Only use your non-lifting hand if it is needed. Otherwise, keep it resting to the side.","As you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions of your training program.","Switch arms and repeat the movement."]},{"one":1,"id":"xOne_Arm_Floor_Press","n":"One Arm Floor Press","p":"hpush","eq":"bb","k":"bb","anim":"floorpress","mus":"triceps|chest delts","lvl":1,"steps":["Lie down on a flat surface with your back pressing against the floor or an exercise mat. Make sure your knees are bent.","Have a partner hand you the bar on one hand. When starting, your arm should be just about fully extended, similar to the starting position of a barbell bench press. However, this time your grip will be neutral (palms facing your torso).","Make sure the hand you are not using to lift the weight is placed by your side.","Begin the exercise by lowering the barbell until your elbow touches the ground. Make sure to breathe in as this is the eccentric (lowering part of the exercise).","Then start lifting the barbell back up to the original starting position. Remember to breathe out during the concentric (lifting part of the exercise).","Repeat until you have performed your recommended repetitions.","Switch arms and repeat the movement."]},{"one":1,"id":"xOne_Arm_Lat_Pulldown","n":"One Arm Lat Pulldown","p":"vpull","eq":"mlat|cable","k":"cable","anim":"latPulldown","mus":"lats|biceps upback","lvl":0,"steps":["Select an appropriate weight and adjust the knee pad to help keep you down. Grasp the handle with a pronated grip. This will be your starting position.","Pull the handle down, squeezing your elbow to your side as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handle to the starting position.","For multiple repetitions, avoid completely returning the weight to keep tension on the muscles being worked."]},{"one":0,"id":"xPush-Up_Wide","n":"Push-Up Wide","p":"hpush","eq":"","k":"bw","anim":"pushup","mus":"chest|abs delts triceps","lvl":0,"steps":["With your hands wide apart, support your body on your toes and hands in a plank position. Your elbows should be extended and your body straight. Do not allow your hips to sag. This will be your starting position.","To begin, allow the elbows to flex, lowering your chest to the floor as you inhale.","Using your pectoral muscles, press your upper body back up to the starting position by extending the elbows. Exhale as you perform this step.","After pausing at the contracted position, repeat the movement for the prescribed amount of repetitions."]},{"one":0,"id":"xPush-Ups_-_Close_Triceps_Position","n":"Push-Ups - Close Triceps Position","p":"hpush","eq":"","k":"bw","anim":"pushup","mus":"triceps|chest delts","lvl":1,"steps":["Lie on the floor face down and place your hands closer than shoulder width for a close hand position. Make sure that you are holding your torso up at arms' length.","Lower yourself until your chest almost touches the floor as you inhale.","Using your triceps and some of your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.","After a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."]},{"one":0,"id":"xRocking_Standing_Calf_Raise","n":"Rocking Standing Calf Raise","p":"calf","eq":"bb","k":"bb","anim":"calf","mus":"calves|","lvl":0,"steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place it on the back of your shoulders (slightly below the neck).","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance. Also maintain a straight back and keep the knees with a slight bend; never locked. This will be your starting position.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending (other than the slight initial bend we created during positioning) at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Now lift your toes by contracting the tibia muscles in the front of the calves as you breathe out.","Hold for a second and bring them back down as you breathe in.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xSeated_Barbell_Military_Press","n":"Seated Barbell Military Press","p":"vpush","eq":"bb","k":"bb","anim":"seatedPress","mus":"delts|triceps","lvl":1,"steps":["Sit on a Military Press Bench with a bar behind your head and either have a spotter give you the bar (better on the rotator cuff this way) or pick it up yourself carefully with a pronated grip (palms facing forward). Tip: Your grip should be wider than shoulder width and it should create a 90-degree angle between the forearm and the upper arm as the barbell goes down.","Once you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the collarbone slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."]},{"one":1,"id":"xSeated_One-arm_Cable_Pulley_Rows","n":"Seated One-arm Cable Pulley Rows","p":"hpull","eq":"mrow|cable","k":"cable","anim":"seatedRow","mus":"upback|biceps lats traps","lvl":1,"steps":["To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the single handle attachment with your left arm using a palms-down grip.","With your arm extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lat as you hold the bar in front of you. The right arm can be kept by the waist. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it as you rotate the wrist, so that by the time your hand is by your abdominals it is in a neutral position (palms facing the torso). Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard.","Hold that contraction for a second and slowly go back to the original position while breathing in. Tip: Remember to rotate the wrist as you go back to the starting position so that the palms are facing down again.","Repeat for the recommended amount of repetitions and then perform the same movement with the right hand."]},{"one":1,"id":"xSingle-Arm_Cable_Crossover","n":"Single-Arm Cable Crossover","p":"fly","eq":"cable","k":"cable","anim":"fly","mus":"chest|","lvl":0,"steps":["Begin by moving the pulleys to the high position, select the resistance to be used, and take a handle in each hand.","Step forward in front of both pulleys with your arms extended in front of you, bringing your hands together. Your head and chest should be up as you lean forward, while your feet should be staggered. This will be your starting position.","Keeping your left arm in place, allow your right arm to extend out to the side, maintaining a slight bend at the elbow. The right arm should be perpendicular to the body at approximately shoulder level.","Return your arm back to the starting position by pulling your hand back to the midline of the body.","Hold for a second at the starting position and repeat the movement on the opposite side. Continue alternating back and forth for the prescribed number of repetitions."]},{"one":0,"id":"xSingle-Leg_Leg_Extension","n":"Single-Leg Leg Extension","p":"quad","eq":"mlegext","k":"cable","anim":"legExt","mus":"quads|","lvl":0,"steps":["Seat yourself in the machine and adjust it so that you are positioned properly. The pad should be against the lower part of the shin but not in contact with the ankle. Adjust the seat so that the pivot point is in line with your knee. Select a weight appropriate for your abilities.","Maintaining good posture, fully extend one leg, pausing at the top of the motion.","Return to the starting position without letting the weight stop, keeping tension on the muscle.","Repeat for the desired number of repetitions."]},{"one":0,"id":"xSplit_Squat_with_Dumbbells","n":"Split Squat with Dumbbells","p":"lunge","eq":"db","k":"db","anim":"lunge","mus":"quads|glutes hams","lvl":0,"steps":["Position yourself into a staggered stance with the rear foot elevated and front foot forward.","Hold a dumbbell in each hand, letting them hang at the sides. This will be your starting position.","Begin by descending, flexing your knee and hip to lower your body down. Maintain good posture througout the movement. Keep the front knee in line with the foot as you perform the exercise.","At the bottom of the movement, drive through the heel to extend the knee and hip to return to the starting position."]},{"one":0,"id":"xStanding_Barbell_Calf_Raise","n":"Standing Barbell Calf Raise","p":"calf","eq":"bb","k":"bb","anim":"calf","mus":"calves|","lvl":0,"steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the bar on the back of your shoulders (slightly below the neck).","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. The knees should be kept with a slight bend; never locked. This will be your starting position. Tip: For better range of motion you may also place the ball of your feet on a wooden block but be careful as this option requires more balance and a sturdy block.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xStanding_Dumbbell_Press","n":"Standing Dumbbell Press","p":"vpush","eq":"db","k":"db","anim":"ohp","mus":"delts|triceps","lvl":0,"steps":["Standing with your feet shoulder width apart, take a dumbbell in each hand. Raise the dumbbells to head height, the elbows out and about 90 degrees. This will be your starting position.","Maintaining strict technique with no leg drive or leaning back, extend through the elbow to raise the weights together directly above your head.","Pause, and slowly return the weight to the starting position."]},{"one":0,"id":"xStanding_Inner-Biceps_Curl","n":"Standing Inner-Biceps Curl","p":"bi","eq":"db","k":"db","anim":"curl","mus":"biceps|","lvl":1,"steps":["Stand up with a dumbbell in each hand being held at arms length. The elbows should be close to the torso. Your legs should be at about shoulder's width apart from each other.","Rotate the palms of the hands so that they are facing inward in a neutral position. This will be your starting position.","While holding the upper arms stationary, curl the weights out while contracting the biceps as you breathe out. Your wrist should turn so that when the weights are fully elevated you have supinated grip (palms facing up).","Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Tip: Keep the forearms aligned with your outer deltoids.","Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the dumbbells back to the starting position as your breathe in. Remember to rotate the wrists as you lower the weight in order to switch back to a neutral grip.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xStanding_Military_Press","n":"Standing Military Press","p":"vpush","eq":"bb","k":"bb","anim":"ohp","mus":"delts|triceps","lvl":0,"steps":["Start by placing a barbell that is about chest high on a squat rack. Once you have selected the weights, grab the barbell using a pronated (palms facing forward) grip. Make sure to grip the bar wider than shoulder width apart from each other.","Slightly bend the knees and place the barbell on your collar bone. Lift the barbell up keeping it lying on your chest. Take a step back and position your feet shoulder width apart from each other.","Once you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the collarbone slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xStiff-Legged_Barbell_Deadlift","n":"Stiff-Legged Barbell Deadlift","p":"hinge","eq":"bb","k":"bb","anim":"rdl","mus":"hams|glutes lowback","lvl":1,"steps":["Grasp a bar using an overhand grip (palms facing down). You may need some wrist wraps if using a significant amount of weight.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the barbell to over the top of your feet by bending at the hips while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Inhale as you perform this movement.","Start bringing your torso up straight again by extending your hips until you are back at the starting position. Exhale as you perform this movement.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xStiff-Legged_Dumbbell_Deadlift","n":"Stiff-Legged Dumbbell Deadlift","p":"hinge","eq":"db","k":"db","anim":"rdl","mus":"hams|glutes lowback","lvl":0,"steps":["Grasp a couple of dumbbells holding them by your side at arm's length.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the dumbbells to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement","Start bringing your torso up straight again by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xTriceps_Pushdown_-_Rope_Attachment","n":"Triceps Pushdown - Rope Attachment","p":"tri","eq":"cable","k":"cable","anim":"pushdown","mus":"triceps|","lvl":0,"steps":["Attach a rope attachment to a high pulley and grab with a neutral grip (palms facing each other).","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the rope with the palms facing each other. This is your starting position.","Using the triceps, bring the rope down as you bring each side of the rope to the side of your thighs. At the end of the movement the arms are fully extended and perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After holding for a second, at the contracted position, bring the rope slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xTriceps_Pushdown_-_V-Bar_Attachment","n":"Triceps Pushdown - V-Bar Attachment","p":"tri","eq":"cable","k":"cable","anim":"pushdown","mus":"triceps|","lvl":0,"steps":["Attach a V-Bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. The thumbs should be higher than the small finger. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the V-Bar slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xTwo-Arm_Kettlebell_Military_Press","n":"Two-Arm Kettlebell Military Press","p":"vpush","eq":"kb","k":"kb","anim":"ohp","mus":"delts|triceps","lvl":1,"steps":["Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you swing the kettlebells towards your shoulders. Rotate your wrists as you do so, so that the palms face forward.","Press the kettlebells up and out. As the kettlebells pass your head, lean into the weights so that the kettlebells are racked behind your head. Make sure to contract your lats, butt, and stomach for added stability."]},{"one":0,"id":"xTwo-Arm_Kettlebell_Row","n":"Two-Arm Kettlebell Row","p":"hpull","eq":"kb","k":"kb","anim":"bentRow","mus":"upback|biceps lats","lvl":1,"steps":["Place two kettlebells in front of your feet. Bend your knees slightly and then push your butt out as much as possible as you bend over to get in the starting position.","Grab both kettlebells and pull them to your stomach, retracting your shoulder blades and flexing the elbows. Keep your back straight. Lower and repeat."]},{"one":0,"id":"xUnderhand_Cable_Pulldowns","n":"Underhand Cable Pulldowns","p":"vpull","eq":"mlat|cable","k":"cable","anim":"latPulldown","mus":"lats|biceps upback delts","lvl":0,"steps":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the pull-down bar with the palms facing your torso (a supinated grip). Make sure that the hands are placed closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, pull the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the fully contracted position and keep the elbows close to your body. The upper torso should remain stationary as your bring the bar to you and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, while breathing in, slowly bring the bar back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."]},{"one":0,"id":"xWide-Grip_Barbell_Bench_Press","n":"Wide-Grip Barbell Bench Press","p":"hpush","eq":"bb+bench","k":"bb","anim":"bench","mus":"chest|delts triceps","lvl":1,"steps":["Lie back on a flat bench with feet firm on the floor. Using a wide, pronated (palms forward) grip that is around 3 inches away from shoulder width (for each hand), lift the bar from the rack and hold it straight over you with your arms locked. The bar will be perpendicular to the torso and the floor. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions."]},{"one":0,"id":"xWide-Grip_Lat_Pulldown","n":"Wide-Grip Lat Pulldown","p":"vpull","eq":"mlat|cable","k":"cable","anim":"latPulldown","mus":"lats|biceps upback delts","lvl":0,"steps":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second at the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."]},{"one":0,"id":"xWide-Grip_Standing_Barbell_Curl","n":"Wide-Grip Standing Barbell Curl","p":"bi","eq":"bb","k":"bb","anim":"curl","mus":"biceps|","lvl":0,"steps":["Stand up with your torso upright while holding a barbell at the wide outer handle. The palm of your hands should be facing forward. The elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]},{"one":0,"id":"xWide_Stance_Barbell_Squat","n":"Wide Stance Barbell Squat","p":"squat","eq":"bb","k":"bb","anim":"squatBar","mus":"quads|calves glutes hams lowback","lvl":1,"steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a wider-than-shoulder-width stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance, and also maintain a straight back. This will be your starting position.","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]}];

function snapKb(kg){const L=kbList();if(!L.length)return null;return L.reduce((a,b)=>Math.abs(b-kg)<Math.abs(a-kg)?b:a)}

function lastSets(id){for(let k=ST.workouts.length-1;k>=0;k--){const it=ST.workouts[k].items.find(x=>x.ex==id);if(it&&it.sets.length)return it.sets}return null}
// Set styles: 'straight' = same weight every set; 'ramp' = build up to a top set (e.g. 60, 80, 80, 90).
// Ramps follow the shape you actually lift: each session's weights and reps are saved as a pattern relative to your top set.
const R0={strength:.6,muscle:.65,general:.65,fatloss:.7,endurance:.75};

function prog(it){const ex=EX[it.ex],L=lift(it.ex),sets=it.sets;if(!sets.length)return null;

  if(sets.length>=it.s&&sets.every(s=>s.r>=b)){if(it.eff=='h'&&!L.hh){L.hh=1;return`${ex.n}: you hit the top of the range but it was hard, so the target stays put once more`}L.hh=0;const st=(ex.t?10:2)*(it.eff=='e'?2:1);L.adj=adj+st;return`${ex.n}: target range moves up to ${a+st}–${b+st} ${unit}${it.eff=='e'?', a bigger step as it felt easy':''}`}
  return null}

  let nw=roundW(L.w+incW(ex)*(big?2:1),ex.k);if(ex.k=='bb'&&plCfg()&&nw<=L.w+.01){const nx=plNext(L.w);if(nx==null){L.adj=adj+2;return`${ex.n}: that's the most your plates can load, so the target moves up to ${a+2}–${b+2} reps`}nw=nx}

 if(at.length&&at.some(s=>s.r<a)){L.f=(L.f||0)+1;if(L.f>=2){if(L.adj){L.adj=Math.max(0,L.adj-2)}else if(ex.k=='kb'&&kbList().length){L.w=[...kbList()].reverse().find(x=>x<L.w-.01)||L.w}else L.w=roundW(L.w*.9,ex.k);L.f=0;return`${ex.n} drops to ${fwu(L.w)} so you can build back up`}return`${ex.n}: stay at ${fwu(L.w)} and get every set to ${a} reps`}

function prCheck(w){const out=[];
 w.items.forEach(it=>{const ex=EX[it.ex];if(!it.sets.length)return;const old=ST.prs[it.ex];
  if(ex.r){let best=null;it.sets.forEach(s=>{if(s.r>0&&s.w>0){const e=e1(s.w,s.r);if(!best||e>best.e)best={e,w:s.w,r:s.r}}});if(!best)return;
   const mw=Math.max(...it.sets.map(s=>s.w));
   if(!old){ST.prs[it.ex]={e1:best.e,w:mw,r:best.r,d:w.d};return}
   let hit=false;if(best.e>old.e1+.05){old.e1=best.e;old.r=best.r;out.push({ex:it.ex,k:'e1',w:best.w,r:best.r,e:best.e});hit=true}
   if(mw>(old.w||0)+.01){if(!hit)out.push({ex:it.ex,k:'w',w:mw});old.w=mw;hit=true}
   if(hit)old.d=w.d}
  else{const mr=Math.max(...it.sets.map(s=>s.r));if(!old){ST.prs[it.ex]={mr,d:w.d};return}

function slope(pts){if(pts.length<2)return null;const x0=pts[0].x;const xs=pts.map(p=>(p.x-x0)/6048e5),ys=pts.map(p=>p.y);
 if(xs[xs.length-1]-xs[0]<.7)return null;const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
 let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});return den?num/den:null}
function liftSeries(id){const ex=EX[id],out=[];ST.workouts.forEach(w=>{const it=w.items.find(x=>x.ex==id);if(!it||!it.sets.length)return;
 const y=ex.r?Math.max(...it.sets.map(s=>s.w>0?e1(s.w,s.r):0)):Math.max(...it.sets.map(s=>s.r));if(y>0)out.push({x:new Date(w.at).getTime(),y,top:Math.max(...it.sets.map(s=>s.w))})});return out}
const bodySeries=()=>[...ST.body.weights].sort((a,b)=>a.d.localeCompare(b.d)).map(e=>({x:dP(e.d).getTime(),y:e.kg,d:e.d}));
function trendW(){const s=bodySeries();if(!s.length)return null;const last=s[s.length-1].x,win=s.filter(p=>p.x>=last-6*864e5);return win.reduce((a,p)=>a+p.y,0)/win.length}
function cardioSeries(type,km){const out=[];ST.workouts.forEach(w=>(w.cardio||[]).forEach(c=>{if(c.type==type&&+c.km>0&&+c.min>0)out.push({x:new Date(w.at).getTime(),y:c.min*60*Math.pow(km/c.km,1.06)})}));return out}
function weekCounts(){const c={};ST.workouts.forEach(w=>{const k=monday(w.d);c[k]=(c[k]||0)+1});return c}
const weekTarget=()=>ST.goal.type=='general'?(+ST.goal.sessions||3):ST.plan.days.length>6?6:(+ST.profile.days||ST.plan.days.length);
function streak(){const t=weekTarget(),c=weekCounts();let n=0,w=monday(today());if((c[w]||0)>=t)n++;w=addD(w,-7);while((c[w]||0)>=t){n++;w=addD(w,-7)}return n}
function gStat(){const g=ST.goal,t=today();if(!g||!g.type)return null;
 const left=g.date?dBet(t,g.date):null,wl=left!=null?Math.max(left/7,.15):null,o={type:g.type,left,g};let ser=[];
 if(g.type=='strength'){const ex=EX[g.ex]||EX.bp,bw=!ex.r;ser=liftSeries(ex.id);
  o.cur=bw?(ST.prs[ex.id]?.mr||0):(ST.prs[ex.id]?.e1||0);o.target=+g.target;o.start=+g.start||0;
  o.fmt=bw?(v=>nf(v,0)+' reps'):(v=>fwu(v));o.rateU=bw?' reps':' '+U();o.rf=bw?(v=>nf(v,1)):(v=>fw(v));
  o.title=ex.n+': '+o.fmt(o.target);o.label=bw?'Best set':'Estimated max';o.has=ser.length>0}
 else if(g.type=='fatloss'||g.type=='muscle'){ser=bodySeries();o.cur=trendW();o.target=+g.target;o.start=+g.start;
  o.fmt=v=>nf(bwv(v),1)+' '+U();o.rateU=' '+U();o.rf=v=>nf(toU(v),2);
  o.title=(g.type=='fatloss'?'Get to ':'Build to ')+o.fmt(o.target);o.label='7-day average';o.has=ser.length>0;ser=ser.filter(p=>p.x>=Date.now()-42*864e5)}
 else if(g.type=='endurance'){ser=cardioSeries(g.cardio,+g.km);o.cur=ser.length?Math.min(...ser.map(p=>p.y)):null;o.target=+g.time;o.start=+g.start||o.cur;
  o.fmt=v=>mmss(v);o.rateU=' s';o.rf=v=>nf(v,0);
  o.title=`${CARDIO[g.cardio][0]} ${nf(+g.km,2)} km in ${mmss(g.time)}`;o.label='Predicted time';o.has=ser.length>0;
  const best=[];let b=Infinity;ser.forEach(p=>{if(p.y<b){b=p.y;best.push({x:p.x,y:p.y})}});ser=best}
 else{const c=weekCounts(),st=monday(g.startDate||t);let hit=0,weeks=0;for(let w=st;w<=monday(t);w=addD(w,7)){weeks++;if((c[w]||0)>=(+g.sessions||3))hit++}
  o.cur=hit;o.target=+g.weeks||8;o.start=0;o.fmt=v=>nf(v,0)+' wk';o.title=`${g.sessions} sessions a week for ${g.weeks} weeks`;o.label='Weeks hit';o.has=true;
  o.pct=clamp(hit/o.target,0,1);o.status=hit>=o.target?'done':(weeks-hit>1&&weeks>2?'behind':'on');o.line=`${hit} of ${weeks} week${weeks==1?'':'s'} hit so far`;return o}
 o.series=ser;const dir=Math.sign(o.target-o.start)||1;
 if(!o.has||o.cur==null){o.pct=0;o.status='nodata';return o}
 const span=o.target-o.start;o.pct=span?clamp((o.cur-o.start)/span,0,1):0;
 const reached=dir>0?o.cur>=o.target-1e-6:o.cur<=o.target+1e-6;if(reached){o.pct=1;o.status='done';return o}
 if(left!=null&&left<0){o.status='over';return o}
 o.rate=slope(ser.filter(p=>p.x>=Date.now()-56*864e5));o.need=wl?(o.target-o.cur)/wl:null;
 if(o.rate==null){o.status='early';return o}
 const r=o.need?o.rate/o.need:0;o.status=r>=1.15?'ahead':r>=.85?'on':'behind';
 if(o.rate*dir>0){const wk=(o.target-o.cur)/o.rate;o.eta=addD(t,Math.round(wk*7))}
 const sg=v=>(v>0?'+':v<0?'−':'')+o.rf(Math.abs(v));o.line=`Needs ${sg(o.need)}${o.rateU} a week · trending ${sg(o.rate)}${o.rateU}`;return o}

function coach(gs,next){const st=streak(),c=weekCounts()[monday(today())]||0,tgt=weekTarget(),more=Math.max(0,tgt-c);
 const wk=more?`<b>${more} more session${more>1?'s':''}</b> this week ${st?`keeps your ${st}-week streak going`:'starts a streak'}.`:`Weekly target hit. <b>${st}-week streak</b>.`;

 if(gs.status=='nodata')return(gs.type=='strength'?`Log ${EX[gs.g.ex]?.n||'your goal lift'} to start tracking your max.`:gs.type=='endurance'?`Log a ${CARDIO[gs.g.cardio][0].toLowerCase()} with a distance to start tracking your time.`:'Log your weight to start your trend line.')+' '+wk;

// ---------- plates: what you own, what you can load, and a picture of the loaded bar ----------
const PLDEF={kg:{unit:'kg',bar:20,pairs:{'25':0,'20':2,'15':0,'10':2,'5':2,'2.5':2,'1.25':2}},lb:{unit:'lb',bar:45,pairs:{'45':2,'35':0,'25':2,'10':2,'5':2,'2.5':2}}};
const defPlates=u=>clone(PLDEF[u]||PLDEF.kg);
const plCfg=()=>{const p=curP();return p&&p.plates&&p.equip&&p.equip.includes('bb')?p.plates:null};
const PLC=new Map();
function plTable(cfg){const key=JSON.stringify(cfg);if(PLC.has(key))return PLC.get(key);
 const sz=Object.keys(cfg.pairs).map(Number).filter(s=>cfg.pairs[s]>0).sort((a,b)=>b-a);let best=new Map([[0,[]]]);
 for(const s of sz){const n=cfg.pairs[s],next=new Map(best);for(const[sum,pl]of best){let acc=sum,arr=pl;for(let c=1;c<=n;c++){acc=+(acc+s).toFixed(3);arr=[...arr,s];const ex=next.get(acc);if(!ex||arr.length<ex.length)next.set(acc,arr)}}best=next}
 const t=[...best.entries()].sort((a,b)=>a[0]-b[0]);PLC.set(key,t);return t}
const plToU=(cfg,kg)=>cfg.unit=='lb'?kg*KL:kg,plFromU=(cfg,v)=>cfg.unit=='lb'?v/KL:v;
function plLoad(kg,cfg){cfg=cfg||plCfg();if(!cfg)return null;const side=(plToU(cfg,kg)-cfg.bar)/2,T=plTable(cfg);let b=T[0];
 for(const e of T)if(Math.abs(e[0]-side)<Math.abs(b[0]-side)-1e-9)b=e;const tot=cfg.bar+2*b[0];return{total:plFromU(cfg,tot),unitTotal:tot,side:b[1],exact:Math.abs(b[0]-side)<1e-6,cfg}}
function plNext(kg,cfg){cfg=cfg||plCfg();if(!cfg)return null;const cur=plToU(cfg,kg)+1e-6,e=plTable(cfg).find(x=>cfg.bar+2*x[0]>cur);return e?plFromU(cfg,cfg.bar+2*e[0]):null}
const plCol=kgv=>kgv>=24?'var(--red)':kgv>=19?'var(--blue)':kgv>=14?'var(--yel)':kgv>=9?'var(--grn)':kgv>=4.5?'var(--fg)':'var(--mut)';
function plSVG(L){const cfg=L.cfg,W=200,HT=84,cy=42;let x=40,g=`<rect x="0" y="${cy-3}" width="28" height="6" rx="2" fill="var(--mut)"/><rect x="28" y="${cy-10}" width="7" height="20" rx="2" fill="var(--mut)"/><rect x="35" y="${cy-4}" width="${W-38}" height="8" rx="3" fill="var(--line)"/>`;
 L.side.forEach(p=>{const kgv=cfg.unit=='lb'?p/KL:p,h=Math.max(22,Math.min(80,20+kgv*2.4)),w=Math.max(5,Math.min(14,4+kgv*.42));g+=`<rect x="${x}" y="${cy-h/2}" width="${w}" height="${h}" rx="2.5" fill="${plCol(kgv)}" stroke="var(--bg)" stroke-width="1"/>`;x+=w+1.5});
 if(L.side.length)g+=`<rect x="${x+1}" y="${cy-8}" width="7" height="16" rx="2" fill="var(--mut)"/>`;
 return`<svg viewBox="0 0 ${W} ${HT}" style="width:100%;max-width:340px;height:auto;display:block;margin:6px 0" role="img" aria-label="${H(plTxt(L))}">${g}</svg>`}
const plTxt=L=>L.side.length?'Each side: '+L.side.map(p=>nf(p,2)).join(' + ')+' '+L.cfg.unit:'Just the bar';
function platesSheet(i){const it=ACT.items[i],cfg=plCfg();if(!cfg)return;const ws=[...new Set([...(it.wu||[]),...it.sets].map(s=>+(+s.w).toFixed(3)).filter(w=>w>0))].sort((a,b)=>a-b);
 openSheet(`<div class="stack"><div><div class="eyebrow">Plate calculator · ${nf(cfg.bar,2)} ${cfg.unit} bar</div><h2>${H(EX[it.ex].n)}</h2></div>

function warmFor(it,t){const ex=EX[it.ex];if(!ST||ST.settings.warm===false||!it.m||!ex||!ex.r||!(t.w>0)||!['bb','db','kb','cable'].includes(ex.k))return[];
 const W=t.ramp?Math.min(...t.sets.map(x=>x.w).filter(w=>w>0)):t.w,out=[],add=(w,r)=>{w=roundW(w,ex.k);if(w>0&&w<W-.01&&!out.some(x=>Math.abs(x.w-w)<.01))out.push({w,r,done:0})};
 if(ex.k=='bb'){const c=plCfg(),bar=c?plFromU(c,c.bar):(U()=='lb'?45/KL:20);if(W>bar*1.4)out.push({w:bar,r:10,done:0})}

const DL=()=>!!(ST&&ST.settings.dlNow&&today()<=ST.settings.dlNow.end);
function dlSuggest(){const S=ST.settings,every=S.deload??6;if(DL()||ST.workouts.length<6)return null;if(S.dlSnooze&&today()<S.dlSnooze)return null;

 if(stalled>=3)return`${stalled} of your main lifts have stalled. A lighter week usually gets them moving again.`;

function idb(){if(IDBP)return IDBP;IDBP=new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error('no storage'));const r=indexedDB.open('overload',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>{IDBP=null;no(r.error)}});return IDBP}

// ---------- supersets ----------
function ssGroups(items){const g=items.map(()=>null);let L=0;for(let i=0;i<items.length;i++){if(g[i]||!items[i].ss||!items[i+1])continue;const ch=[i];let k=i;while(items[k].ss&&items[k+1]){k++;ch.push(k)}const lt=String.fromCharCode(65+L++);ch.forEach((x,n)=>g[x]={lt,n:n+1,of:ch.length})}return g}
function ssChain(items,i){let s=i;while(s>0&&items[s-1].ss)s--;const ch=[];for(let k=s;k<items.length;k++){ch.push(k);if(!items[k].ss)break}return ch}
function afterSet(i){const A=ACT.items,it=A[i],ch=ssChain(A,i),pos=ch.indexOf(i);
 if(ch.length>1){// move round the pair: next exercise in the superset that still has a set to do
  for(let n=1;n<ch.length;n++){const k=ch[(pos+n)%ch.length];if(pos+n<ch.length&&A[k].sets.some(s=>!s.done)){REST=null;UI.jump=k;toast('Straight into '+EX[A[k].ex].n);return}}}
 const allDone=A.every(x=>x.sets.every(s=>s.done)),lastEx=i==A.length-1&&it.sets.every(x=>x.done);
 if(allDone||(ch.length==1&&lastEx))return;
 const r=Math.max(...ch.map(k=>A[k].r));startRest(r,ch.length>1?'the superset':EX[it.ex].n);
 if(ch.length>1&&ch.some(k=>A[k].sets.some(s=>!s.done)))UI.jump=ch.find(k=>A[k].sets.some(s=>!s.done))}
function ssToggle(i){const A=ACT.items,it=A[i];it.ss=it.ss?0:1;let saved=false;
 const day=ST.plan.days[ACT.day];if(day&&it.pi!=null&&day.items[it.pi]&&day.items[it.pi].ex==it.ex){const nx=A[i+1];if(!it.ss||(nx&&nx.pi==it.pi+1&&day.items[nx.pi]&&day.items[nx.pi].ex==nx.ex)){day.items[it.pi].ss=it.ss;saved=true;persist('core')}}
 saveAct();closeSheet();render();toast(it.ss?(saved?'Paired. Saved to your plan too.':'Paired for today'):'Unpaired')}

function startRest(sec,lbl){REST={end:Date.now()+sec*1000,total:sec,lbl,beeped:false};tickRest()}
function restAdj(d){if(!REST)return;REST.end+=d*1000;REST.total=Math.max(1,REST.total+d);REST.beeped=false;tickRest()}
function restSkip(){REST=null;tickRest()}
function tickRest(){const t=$('#timer');if(VIEW!='workout'||!REST||WIZ){t.hidden=true;return}
 const left=(REST.end-Date.now())/1000;t.hidden=false;t.classList.toggle('over',left<=0);
 $('#tleft').textContent=left>0?mmss(Math.ceil(left)):'Go';$('#tlbl').textContent=left>0?'Rest after '+REST.lbl:'Go, next set';
 $('#tfill').style.width=clamp(100-left/REST.total*100,0,100)+'%';$('#tring').style.strokeDashoffset=(169.6*(1-clamp(left/REST.total,0,1))).toFixed(1);
 if(left<=0&&!REST.beeped){REST.beeped=true;beep()}if(left<-25)REST=null}
setInterval(()=>{if(VIEW=='workout'&&ACT){const e=$('#elapsed');if(e)e.textContent=mmss((Date.now()-ACT.start)/1000)}tickRest()},500);

  if(!d.items.length&&!d.cardio)h+=`<p class="hint" style="margin-top:10px">No exercises yet.</p>`;

   if(d.cardio)h+=`<div class="pli"><span></span><div class="n">${CARDIO[d.cardio.type][0]}</div><span class="big-w">${d.cardio.min}<small>min</small></span></div>`;h+='</div>'}
  h+=`<button class="addx" onclick="addExSheet('${di}')"><i>+</i>Add exercise</button></section>`});
 h+=`<button class="btn full dash" style="margin:20px 0" onclick="addDay()">Add a day</button>
 <section class="card"><h3>How the plan pushes you</h3><p class="hint" style="margin-top:8px">Each exercise has a rep range. When you hit the top of the range on every set (or on your top set, for build-up lifts), the weight goes up next time. Build-up lifts copy the pattern you actually lift, so if you go 60, 80, 80, 90 the next session ramps the same way to the new top weight. Miss the bottom of the range twice in a row and it drops 10% so you can build back. Bodyweight moves raise the rep range instead. If you tell it how the last set felt, an easy set earns a bigger jump and a hard one holds the weight for one more session.</p>
