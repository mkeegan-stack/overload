  ${lb?`<div class="grid2"><label class="f">Height (ft)<input id="hft" type="number" inputmode="numeric" value="${ft}" onchange="wzHeight()"></label><label class="f">Height (in)<input id="hin" type="number" inputmode="numeric" value="${inch}" onchange="wzHeight()"></label></div>`
  :`<label class="f">Height (cm)<input id="hcm" type="number" inputmode="numeric" value="${d.hCm?Math.round(d.hCm):''}" onchange="wzHeight()"></label>`}`}
 if(s=='train')h+=`<h2>Your training</h2><div class="opts">${Object.entries(EXP).map(([k,[a,b]])=>`<button class="opt" aria-pressed="${d.exp==k}" onclick="wz('exp','${k}',1)"><b>${a}</b><span>${b}</span></button>`).join('')}</div>
  <div><div class="eyebrow" style="margin-bottom:8px">Days a week</div>${chipsH('days',[2,3,4,5,6].map(x=>[x,x+' days']))}</div>
  <div><div class="eyebrow" style="margin-bottom:8px">Time per session</div>${chipsH('mins',[30,45,60,75,90].map(x=>[x,x+' min']))}</div>`;
 if(s=='kit'){const kbOn=d.equip.includes('kb'),dbOn=d.equip.includes('db');
  h+=`<h2>Your equipment</h2><p class="mut">Tick only what you can actually use. For an all-in-one machine, tick each station it has. Bodyweight moves are always included.</p>
  ${EQG.map(([g,L])=>`<div><div class="eyebrow" style="margin-bottom:8px">${g}</div>${chipsH('equip',L,1)}</div>`).join('')}
  ${d.equip.includes('bb')?`<div class="card" style="padding:14px"><h3 style="margin-bottom:10px">Your barbell and plates</h3>${plEditHTML(d.plates||(d.plates=defPlates(d.units)),'w')}</div>`:''}
  ${dbOn?`<label class="f">Heaviest dumbbell (${U()})<input type="number" inputmode="decimal" step="any" value="${d.dbMax?wv(d.dbMax):''}" placeholder="Leave blank for a full set" onchange="wz('dbMax',fromU(+this.value)||'')"></label>`:''}
  ${kbOn?`<div><div class="eyebrow" style="margin-bottom:8px">Kettlebells you own</div><div class="chips">${KBW[U()].map(v=>{const kg=fromU(v),on=d.kbs.some(x=>Math.abs(x-kg)<.3);return`<button class="chip" aria-pressed="${on}" onclick="wzKb(${v})">${v} ${U()}</button>`}).join('')}</div><p class="hint" style="margin-top:6px">Kettlebell exercises use these exact weights and step up to your next bell.</p></div>`:''}
  <p class="hint">If something in your plan still isn't possible, you can rule it out on the next screens or any time later.</p>`}
 if(s=='limits')h+=`<h2>Anything to go easy on?</h2><p class="mut">Exercises that load these areas are left out of your plan.</p>${chipsH('limits',LIM,1)}<p class="hint">This isn't medical advice. For pain or an injury, check with a physio first.</p>`;
 if(s=='goal')h+=`<h2>What's the goal?</h2><p class="mut">Everything in the app points at this. You can change it later.</p><div class="opts">${Object.entries(GT).map(([k,[a,b]])=>`<button class="opt" aria-pressed="${d.goal.type==k}" onclick="wd().goal={type:'${k}'};WIZ.err='';render()"><b>${a}</b><span>${b}</span></button>`).join('')}</div>`;
 if(s=='target')h+=targetStep();
 if(s=='review'){const p=draftProfile(),pl=buildPlan(p,d.goal);
  h+=`<h2>Your plan is ready</h2><p class="mut">${pl.days.length} sessions a week built for ${GT[d.goal.type][0].toLowerCase()}. You can swap any exercise later.</p>
  <p class="hint">Can't do one of these with your setup? Tap the cross and it's replaced with something you can do.</p>
  ${pl.days.map(dy=>`<section class="card"><div class="eyebrow">About ${dayMin(dy)} min</div><h3>${H(dy.n)}</h3><div class="list" style="margin-top:8px">${dy.items.map(it=>`<div class="li"><div class="nmr">${thumb(it.ex)}<div class="nm">${EX[it.ex].n}</div></div><div class="row" style="flex-wrap:nowrap;gap:4px"><span class="val">${it.s} × ${it.a}–${it.b}${EX[it.ex].t?'s':''}</span><button class="ib" aria-label="I can't do ${EX[it.ex].n}" onclick="wzBlock('${it.ex}')">${IC.x}</button></div></div>`).join('')}${dy.cardio?`<div class="li"><div class="nm">${CARDIO[dy.cardio.type][0]}</div><div class="val">${dy.cardio.min} min</div></div>`:''}</div></section>`).join('')}
  ${d.blocked.length?`<div><div class="eyebrow" style="margin-bottom:8px">Ruled out · tap to bring back</div><div class="chips">${d.blocked.map(id=>`<button class="chip" onclick="wzBlock('${id}')">${EX[id].n} ✕</button>`).join('')}</div></div>`:''}`}
 if(WIZ.err)h+=`<p class="warn" role="alert">${WIZ.err}</p>`;
 h+=`<div class="wzf">${WIZ.step>0||WIZ.edit?`<button class="btn sec" onclick="wzBack()">${WIZ.edit&&WIZ.step<=1?'Cancel':'Back'}</button>`:''}
  <button class="btn pri" onclick="${s=='review'?'finishWiz()':'wzNext()'}">${s=='review'?(WIZ.edit?'Save changes':'Build my plan'):s=='start'?'Get started':WIZ.only&&s=='target'?'Save goal':'Next'}</button></div>`;
 if(s=='start'&&!WIZ.edit)h+=`<div class="row" style="justify-content:center;gap:18px;padding-bottom:12px"><button class="link" onclick="$('#impFile').click()">Restore a backup</button><button class="link" onclick="startDemo()">Look around with demo data</button></div>`;
 return h+'</div>'}
function targetStep(){const g=wd().goal,p=draftProfile();let h=`<h2>${GT[g.type][0]}</h2>`;
 const date=`<label class="f">Target date<input type="date" min="${addD(today(),7)}" value="${g.date||''}" onchange="wd().goal.date=this.value;WIZ.err='';render()"></label>`;
 if(g.type=='strength'){const L=goalLifts(),ex=EX[g.ex],cur=(ST&&ST.prs[ex.id]?.e1)||e1(est(ex,p),5);
  h+=`<label class="f">Lift<select onchange="const g=wd().goal;g.ex=this.value;g.target=0;goalDefaults();render()">${L.map(e=>`<option value="${e.id}"${e.id==g.ex?' selected':''}>${e.n}</option>`).join('')}</select></label>
  ${ex.r?`<label class="f">Target one-rep max (${U()})<input type="number" inputmode="decimal" step="any" value="${wv(g.target)}" onchange="wd().goal.target=fromU(+this.value);WIZ.err=''"></label><p class="hint">Your estimated max today is around ${fwu(cur)}. Most lifters can add 5–15% in three months.</p>`
  :`<label class="f">Target reps in one set<input type="number" inputmode="numeric" value="${g.target}" onchange="wd().goal.target=+this.value;WIZ.err=''"></label>`}${date}`}
 if(g.type=='fatloss'||g.type=='muscle'){const wks=g.date?Math.max(1,dBet(today(),g.date)/7):12,rate=(g.target-p.weightKg)/wks,pc=Math.abs(rate)/p.weightKg*100,fast=g.type=='fatloss'?pc>1:pc>.5;
  h+=`<label class="f">Target body weight (${U()})<input type="number" inputmode="decimal" step="any" value="${bwv(g.target)}" onchange="wd().goal.target=fromU(+this.value);WIZ.err='';render()"></label>${date}
  <p class="${fast?'warn':'hint'}">That's ${nf(Math.abs(toU(rate)),2)} ${U()} a week (${nf(pc,1)}% of body weight). ${fast?(g.type=='fatloss'?'Faster than 1% a week risks losing muscle. Try a later date.':'Faster than 0.5% a week tends to add more fat than muscle. Try a later date.'):'A sensible pace.'}</p>`}
 if(g.type=='endurance'){h+=`<label class="f">Activity<select onchange="wd().goal.cardio=this.value;render()">${Object.entries(CARDIO).filter(([k,v])=>!v[2]&&(!v[1]||p.equip.includes(v[1]))).map(([k,v])=>`<option value="${k}"${k==g.cardio?' selected':''}>${v[0]}</option>`).join('')}</select></label>
  <div class="grid2"><label class="f">Distance (km)<input type="number" inputmode="decimal" step="any" value="${g.km}" onchange="wd().goal.km=+this.value;WIZ.err=''"></label><label class="f">Target time (mm:ss)<input inputmode="numeric" value="${mmss(g.time)}" onchange="wd().goal.time=parseT(this.value)||0;WIZ.err=''"></label></div>${date}
  <p class="hint">Log your sessions with distance and time. The app predicts your time over the goal distance from every effort.</p>`}
 if(g.type=='general')h+=`<div><div class="eyebrow" style="margin-bottom:8px">Sessions every week</div><div class="chips">${[2,3,4,5,6].map(x=>`<button class="chip" aria-pressed="${g.sessions==x}" onclick="wd().goal.sessions=${x};render()">${x}</button>`).join('')}</div></div>
  <div><div class="eyebrow" style="margin-bottom:8px">For how long</div><div class="chips">${[4,8,12,16,26].map(x=>`<button class="chip" aria-pressed="${g.weeks==x}" onclick="wd().goal.weeks=${x};render()">${x} weeks</button>`).join('')}</div></div>`;
 return h}
function finishWiz(){const e=wizValid();if(e){WIZ.err=e;render();return}
 const p=draftProfile(),g=clone(wd().goal),t=today();
 const sameGoal=ST&&ST.goal&&['type','ex','target','date','cardio','km','time','sessions','weeks'].every(k=>ST.goal[k]==g[k]);
 if(!ST){ST=norm({v:1,profile:p,goal:g,settings:{theme:themeMode()},plan:buildPlan(p,g),body:{weights:[{d:t,kg:p.weightKg}],meas:[]},workouts:[]})}
 else{const old=ST.profile,planKeys=['days','mins','exp'].some(k=>old[k]!=p[k])||old.equip.join()!=p.equip.join()||old.limits.join()!=p.limits.join()||(old.blocked||[]).join()!=p.blocked.join()||(old.kbs||[]).join()!=p.kbs.join()||ST.goal.type!=g.type;
  if(Math.abs(old.weightKg-p.weightKg)>.05){ST.body.weights=ST.body.weights.filter(e=>e.d!=t);ST.body.weights.push({d:t,kg:p.weightKg})}
  ST.profile=p;if(sameGoal)Object.assign(g,{start:ST.goal.start,startDate:ST.goal.startDate});ST.goal=g;if(planKeys&&ST.plan.auto)ST.plan=Object.assign(buildPlan(p,g),{id:ST.plan.id,name:ST.plan.name})}
 if(!sameGoal){g.startDate=t;
  if(g.type=='strength'){const ex=EX[g.ex],pr=ST.prs[g.ex];g.start=ex.r?(pr?.e1||0):(pr?.mr||0)}
  if(g.type=='fatloss'||g.type=='muscle')g.start=trendW()||p.weightKg;
  if(g.type=='endurance'){const s=cardioSeries(g.cardio,+g.km);g.start=s.length?Math.min(...s.map(x=>x.y)):0}
  delete ST.badges.goal}
 ensureLifts();
 if(g.type=='strength'&&!g.start&&EX[g.ex].r)g.start=e1(lift(g.ex).w,5);
 const wasEdit=WIZ.edit;WIZ=null;VIEW=wasEdit?'me':'today';persist('core','body');render();scrollTo(0,0);toast(wasEdit?'Saved':'Plan built. Your first session is ready.');if(!wasEdit)setTimeout(pendPlan,700)}

// ---------- DEMO ----------
function startDemo(){DEMO=true;WIZ=null;const t=today();let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
 const p={name:'Sam',units:'kg',sex:'m',age:31,heightCm:180,weightKg:84,exp:'int',days:4,mins:60,equip:['bb','bench','db','cable','mlat','mrow','mlegext','mlegcurl','pull','row'],dbMax:36,kbs:[],blocked:[],eqV:2,limits:[]};
 const g={type:'strength',ex:'bp',target:0,date:addD(t,70),startDate:addD(t,-42)};
 ST=norm({profile:p,goal:g,settings:{theme:themeMode()},plan:buildPlan(p,g),body:{weights:[],meas:[{d:addD(t,-40),waist:88,chest:104,arm:36,thigh:58}]},workouts:[]});
 ensureLifts();g.start=e1(lift('bp').w,5);g.target=roundW(g.start*1.12,'bb');
 for(let i=42;i>=1;i--){const d=addD(t,-i),dow=(dP(d).getDay()+6)%7;
  if(i%2==0)ST.body.weights.push({d,kg:84+(42-i)*.025+(rnd()-.5)*.7});
  if([0,1,3,4].includes(dow)&&rnd()>.12){const a=newActive(ST.plan.next%ST.plan.days.length),st=dP(d).getTime()+17.5*36e5;a.start=st;
   const bad=rnd()<.05;a.items.forEach(it=>{const up=rnd()<.6;it.sets.forEach((s,j)=>{s.done=1;s.r=Math.min(it.t.b,it.t.r+(up?1:0));if(bad&&j==it.sets.length-1)s.r=Math.max(1,it.t.a-1)})});if(a.cardio)a.cardio.done=1;
   finalize(a,{end:st+(52+rnd()*14)*6e4,d})}}
 VIEW='today';render();scrollTo(0,0)}
function exitDemo(){DEMO=false;ST=null;ACT=null;REST=null;WIZ=newWiz(false);VIEW='today';loadLocal();if(ST)WIZ=null;render();scrollTo(0,0)}

// ---------- boot ----------
loadLocal();if(ACT){VIEW='workout';wake()}render();connect();planHash();addEventListener('hashchange',planHash);backGuard();
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);
</script>
