/* fonts ship with the app (SIL Open Font License, see fonts/) so it looks right offline */
@font-face{font-family:"Big Shoulders Display";src:url("fonts/BigShouldersDisplay.woff") format("woff");font-weight:100 900;font-display:swap}
@font-face{font-family:"Figtree";src:url("fonts/Figtree.woff") format("woff");font-weight:300 900;font-display:swap}
/* Layout: one phone-width column, bottom tab bar, plate-ring hero; bumper-plate colours code the data (red = goal, blue = body, yellow = records, green = done) */
:root{
 --bg:#0f1114;--surf:#181b20;--surf2:#22262c;--line:#2e333a;--fg:#eef1f4;--mut:#8f98a3;
 --red:#ff5141;--red2:#ff8f3a;--blue:#5b97ff;--yel:#ffc93c;--grn:#35c47f;
 --onacc:#170b08;--glow:rgba(255,81,65,.22);--body:#2c3139;--mus:#3e4550;--man:#cfd5dc;--shade:rgba(0,0,0,.55);
 --fd:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
 --fb:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
 --bg:#f1f2f4;--surf:#fff;--surf2:#eaecef;--line:#d9dde2;--fg:#121418;--mut:#5c6570;
 --red:#e0382a;--red2:#e86a1c;--blue:#2462d4;--yel:#a87b00;--grn:#11834b;
 --onacc:#fff;--glow:rgba(224,56,42,.18);--body:#cdd2d9;--mus:#b3bac4;--man:#717b87;--shade:rgba(10,12,16,.35);color-scheme:light}}
:root[data-theme="light"]{
 --bg:#f1f2f4;--surf:#fff;--surf2:#eaecef;--line:#d9dde2;--fg:#121418;--mut:#5c6570;
 --red:#e0382a;--red2:#e86a1c;--blue:#2462d4;--yel:#a87b00;--grn:#11834b;
 --onacc:#fff;--glow:rgba(224,56,42,.18);--body:#cdd2d9;--mus:#b3bac4;--man:#717b87;--shade:rgba(10,12,16,.35);color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--fb);
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body.wk{padding-block-end:calc(120px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:560px;margin:0 auto}
html,body{touch-action:manipulation;scrollbar-width:none;overflow-x:clip}
::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-height:calc(100lvh + 1px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text}
img.keep{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.ssc{border-left:3px solid var(--red)}
.steps{margin:4px 0 0;padding-left:22px;display:grid;gap:8px;color:var(--fg)}.steps b{font-weight:800}
.chip.mini{min-height:32px;padding:4px 12px;font-size:12.5px}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:.01em;line-height:1.02}
h2{font-size:24px;font-weight:800;text-transform:uppercase}
h3{font-size:21px;font-weight:800}
p{margin:0}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:22px 16px}
.top h1{font-size:40px;font-weight:900;text-transform:uppercase}
.stack{display:grid;gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.card>.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-width:0}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mgrid .wide{grid-column:1/-1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:15px;font-weight:800;font-size:16px;letter-spacing:.01em}
.btn.pri{background:linear-gradient(100deg,var(--red),var(--red2));color:var(--onacc);box-shadow:0 10px 26px var(--glow)}
.btn.sec{background:var(--surf2);border:1px solid var(--line)}
.btn.ghost{color:var(--mut);font-weight:700}
.btn.dang{color:var(--red);font-weight:700}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--red);font-weight:700;text-decoration:underline;text-underline-offset:3px}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:48px;min-width:0}
textarea{min-height:70px;resize:vertical}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
label.f{display:grid;gap:6px;font-size:13px;color:var(--mut);font-weight:700;min-width:0}
.hint{font-size:13px;color:var(--mut);font-weight:500}
.warn{font-size:13px;color:var(--red);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 15px;min-height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surf2);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.opts{display:grid;gap:10px}
.opt{display:grid;gap:3px;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surf);width:100%}
.opt b{font-size:16px}.opt span{color:var(--mut);font-size:13.5px}
.opt[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--surf2);color:var(--mut)}
.pill.ok{background:color-mix(in srgb,var(--grn) 18%,transparent);color:var(--grn)}
.pill.bad{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.pill.gold{background:color-mix(in srgb,var(--yel) 20%,transparent);color:var(--yel)}
.pill.cool{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.demo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--blue) 14%,var(--surf));border:1px solid color-mix(in srgb,var(--blue) 40%,var(--line));font-size:13.5px;font-weight:600}
/* goal plate */
.goal{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.plate{width:150px;height:150px;display:block}
.pl-o{fill:var(--surf2)}.pl-k{stroke:var(--line);stroke-width:2;fill:none}
.pl-t{fill:none;stroke:var(--bg);stroke-width:13}
.pl-p{fill:none;stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.pl-i{fill:var(--surf)}
.pl-n{fill:var(--fg);font:900 42px var(--fd);text-anchor:middle}
.pl-s{fill:var(--mut);font:700 10px var(--fb);text-anchor:middle;letter-spacing:.14em}
.big{font-family:var(--fd);font-weight:900;font-size:30px;line-height:1}
.kv{display:grid;gap:2px}
.kv b{font-family:var(--fd);font-size:24px;font-weight:800;line-height:1}
.coach{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surf2);font-weight:600;font-size:14.5px}
.coach b{color:var(--red)}
@media (max-width:380px){.goal{grid-template-columns:1fr;justify-items:center;text-align:center}.goal .row{justify-content:center}}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:grid;justify-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--mut)}
.wd i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.wd.on i{background:var(--red);border-color:var(--red);color:var(--onacc)}
.wd.on i svg{width:16px;height:16px}
.wd.now{color:var(--fg)}.wd.now i{border-color:var(--fg)}
/* exercise lists */
.list{display:grid}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0;padding-top:2px}
.li .nm{font-weight:700;min-width:0}
.li .sub{font-size:13px;color:var(--mut)}
.li .val{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-left:6px}
/* workout */
.wh{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:14px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.wh h1{font-size:28px;font-weight:900;text-transform:uppercase}
.clock{font:800 22px var(--fd);font-variant-numeric:tabular-nums;color:var(--mut)}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.exh .sub{font-size:13px;color:var(--mut);margin-top:3px}
.exh .tgt{color:var(--fg);font-weight:700}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mut);flex:none}
.ib svg{width:20px;height:20px}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;align-items:center}
.set.hdr{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.set.hdr span{text-align:center}.set.hdr span:first-child{text-align:left}
.sn{font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums}
.set input{text-align:center;font-weight:800;font-variant-numeric:tabular-nums;padding:8px 4px}
.set .na{text-align:center;color:var(--mut);font-weight:700;font-size:13px}
.tick{width:50px;height:48px;border-radius:13px;background:var(--surf2);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut)}
.tick svg{width:22px;height:22px}
.set.done .tick{background:var(--grn);border-color:var(--grn);color:#04150c}
.set.done input{border-color:color-mix(in srgb,var(--grn) 55%,var(--line));background:color-mix(in srgb,var(--grn) 8%,var(--surf2))}
/* nav, timer, sheet, toast */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
 padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--mut)}
#nav svg{width:24px;height:24px}
#nav button[aria-current="page"]{color:var(--fg)}
#nav button[aria-current="page"] svg{color:var(--red)}
#timer{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surf);border-top:1px solid var(--line);
 padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#timer .in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.tbar{height:6px;border-radius:6px;background:var(--surf2);overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--red2))}
#tleft{font:900 30px var(--fd);font-variant-numeric:tabular-nums;min-width:74px}
#timer.over #tleft{color:var(--grn)}
#sheet{position:fixed;inset:0;z-index:40;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
#sheet .pan{background:var(--surf);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;
 padding:20px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;padding:11px 16px;border-radius:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
/* wizard */
.wz{display:grid;gap:18px;padding-block:20px 10px}
.prog{display:grid;grid-auto-flow:column;gap:4px}
.prog i{height:4px;border-radius:4px;background:var(--surf2)}
.prog i.on{background:var(--red)}
.hero h1{font-size:54px;font-weight:900;text-transform:uppercase;line-height:.92}
.hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--red),var(--red2));-webkit-background-clip:text;background-clip:text;color:transparent}
.wz h2{font-size:32px}
.wzf{display:flex;gap:10px;position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.wzf .btn.pri{flex:1}
/* charts */
.ch{width:100%;height:auto;display:block;overflow:visible}
.ch .g{stroke:var(--line);stroke-width:1;fill:none}
.ch text{fill:var(--mut);font:600 10.5px var(--fb)}
.ch .l1{stroke:var(--red);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ch .l2{stroke:var(--blue);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ch .l3{stroke:var(--mut);stroke-width:1.5;fill:none;stroke-dasharray:3 5}
.ch .a1{fill:var(--red);opacity:.12;stroke:none}
.ch .a2{fill:var(--blue);opacity:.12;stroke:none}
.ch .d1{fill:var(--red);stroke:none}.ch .d2{fill:var(--blue);stroke:none}
.ch .dm{fill:var(--mut);opacity:.55;stroke:none}
.ch .tg{stroke:var(--yel);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.ch .tt{fill:var(--yel);font-weight:800}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surf2);border-radius:14px}
.seg button{padding:9px 4px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.bdg{display:grid;justify-items:center;text-align:center;gap:6px;font-size:12.5px;font-weight:700;min-width:0}
.bdg .disc{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--surf2);border:2px dashed var(--line);color:var(--mut)}
.bdg .disc::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--bg)}
.bdg.got .disc{border:6px solid var(--c);background:color-mix(in srgb,var(--c) 30%,var(--surf))}
.bdg small{color:var(--mut);font-weight:500;font-size:11.5px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3>div{background:var(--surf2);border-radius:14px;padding:12px}
.stat3 b{display:block;font:900 26px var(--fd);line-height:1.05}
.stat3 span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.sw{position:relative;width:52px;height:30px;border-radius:30px;background:var(--surf2);border:1px solid var(--line);flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--grn);border-color:var(--grn)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:#fff}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:right;padding:6px 4px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-top:1px solid var(--line);text-align:right;font-weight:600}
.up{color:var(--grn)}.dn{color:var(--red)}
/* body map */
.fig .fb{fill:var(--body)}.fig .fl{fill:none;stroke:var(--body);stroke-linecap:round}
.fig .fm{fill:var(--mus);stroke:var(--body);stroke-width:.8}
.fig .fm.p2{fill:color-mix(in srgb,var(--red) 42%,var(--mus))}.fig .fm.p1{fill:var(--red)}
.fig text{fill:var(--mut);font:800 8.5px var(--fb);letter-spacing:.14em;text-anchor:middle}
.th{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--surf2);border:1px solid var(--line)}
.th svg{width:40px;height:38px}.th.lg{width:60px;height:60px;border-radius:14px}.th.lg svg{width:54px;height:52px}
.nmr{display:flex;align-items:center;gap:12px;min-width:0}
.figbig{background:var(--surf2);border-radius:18px;padding:16px 12px 8px;display:grid;place-items:center}
.figbig svg{width:100%;max-width:300px;height:auto}
.legend{display:grid;gap:6px;font-size:14px}.legend div{display:flex;gap:9px;align-items:baseline}
.sw2{width:12px;height:12px;border-radius:3px;flex:none;transform:translateY(1px);background:var(--mus)}
.sw2.p1{background:var(--red)}.sw2.p2{background:color-mix(in srgb,var(--red) 42%,var(--mus))}
.steps{margin:0;padding-left:22px;display:grid;gap:8px}.steps li{padding-left:4px}.steps li::marker{font-weight:800;color:var(--red)}
.exn{text-align:left}
/* movement animation */
.anim3{display:block;touch-action:none;max-width:100%;cursor:grab;border-radius:12px}
.anim{width:100%;max-width:340px;height:auto;display:block}
.anim .ag{stroke:var(--line);stroke-width:1.5;fill:none}
.anim .al{stroke:var(--fg);fill:none;stroke-linecap:round}
.anim .alf{stroke:var(--mut);fill:none;stroke-linecap:round;opacity:.75}
.anim .ahd{fill:var(--fg)}
.anim .ap{stroke:var(--mut);fill:none;stroke-linecap:round;opacity:.8}
.anim .apf{fill:var(--mut);opacity:.35}
.anim .aw{stroke:var(--red);stroke-width:3;fill:none}
.anim .awf{fill:var(--red)}
.anim .ah{fill:var(--mut)}.anim .ahole{fill:var(--surf2)}.anim .ahdo{stroke:var(--surf2);stroke-width:2}
.anim .acab{stroke:var(--mut);stroke-width:1.2;fill:none}
.anim .aband{stroke:var(--red2);stroke-width:1.6;stroke-dasharray:3 2;fill:none}
.set.wu .na{color:var(--mut)}.set.wu .sn{font-size:12px}
.phg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;display:block;border-radius:12px;overflow:hidden;background:var(--surf2);aspect-ratio:3/4;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:999px}
/* ===== Redesign: no boxes; sections sit on the floor, plates and bars carry the data ===== */
:root{--line2:#353b44;--rub:#181b20;--dim:#4f5761;--gold:var(--yel)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--line2:#c3c9d1;--rub:#e3e6ea;--dim:#8d959f}}
:root[data-theme="light"]{--line2:#c3c9d1;--rub:#e3e6ea;--dim:#8d959f}
body{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--mut);font-weight:600}
.top{padding-block:30px 6px;align-items:flex-start}
.top h1{font-size:62px;line-height:.86;letter-spacing:-.005em}
.top .eyebrow{margin-bottom:6px}
.top .meta{color:var(--mut);font-weight:600;font-size:14px;margin-top:8px}
h2{font-size:30px;font-weight:900;line-height:.92}
h3{font-size:25px;font-weight:900;text-transform:uppercase;line-height:.95}
.stack{gap:0}
.card{background:none;border:0;border-radius:0;padding:24px 0 26px;position:relative}
.stack>.card+.card::before{content:"";position:absolute;left:-20px;right:-20px;top:0;height:6px;background:var(--rub)}
#pan .stack>.card+.card::before{left:-16px;right:-16px}
.stack>.btn,.stack>label.f,.stack>.seg,.stack>.tabs{margin-top:14px}
.stack.tight,.card.stack,.wz .stack,#pan>.stack{gap:14px}
.card>.hd{margin-bottom:14px;align-items:center}
.btn{border-radius:999px;min-height:52px}
.btn.pri{box-shadow:0 10px 28px var(--glow)}
.btn.sec{background:none;border:1.5px solid var(--line2)}
.btn.sm{min-height:38px;border-radius:999px;padding:0 15px}
.btn.dang{color:var(--red)}
.link{text-decoration:none;color:var(--red2)}
.chip{background:none;border:1.5px solid var(--line2)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input,select,textarea{background:var(--surf);border:1.5px solid var(--line);border-radius:14px}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
.pill{background:none;padding:0;text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:700;color:var(--mut);gap:7px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
.pill.ok{background:none;color:var(--grn)}.pill.bad{background:none;color:var(--red)}.pill.gold{background:none;color:var(--yel)}.pill.cool{background:none;color:var(--blue)}
.pill.gold::before{background:none;border:2.5px solid currentColor;width:9px;height:9px}
.tag{letter-spacing:.02em;text-transform:none;font-size:12px;margin-left:8px}
.li{padding:13px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:1px solid var(--line);padding-top:13px}
.list{border-bottom:1px solid var(--line)}
.li .val{font-weight:700}
.th{background:none;border:0;width:40px;height:44px}
.coach{background:none;padding:0;margin-top:16px;font-weight:500;color:var(--mut);font-size:14.5px}
.coach b{color:var(--fg)}
.demo{border-radius:999px;padding:8px 8px 8px 16px;background:color-mix(in srgb,var(--blue) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--blue) 45%,transparent)}
.demo .btn{min-height:36px}
/* tabs: plain words with a red underline */
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);overflow-x:auto;margin-inline:-20px;padding-inline:20px}
.tabs button{font-weight:800;font-size:15px;color:var(--mut);padding:4px 0 12px;position:relative;white-space:nowrap}
.tabs button[aria-pressed="true"]{color:var(--fg)}
.tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--red),var(--red2))}
/* segmented choices become a row of pills */
.seg{display:flex;flex-wrap:wrap;gap:8px;padding:0;background:none;border-radius:0}
.seg button{flex:1;border:1.5px solid var(--line2);border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:none;color:var(--fg);border-color:var(--red);box-shadow:none}
/* switches */
.sw{background:var(--surf2);border:0;width:50px;height:30px}
.sw::after{top:3px;left:3px;width:24px;height:24px}
.sw[aria-checked="true"]{background:linear-gradient(90deg,var(--red),var(--red2));border:0}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
/* settings and other label/control rows become a ruled list */
.card.stack>.row.sp{min-height:56px;border-top:1px solid var(--line);flex-wrap:nowrap}
.card.stack>.row.sp:last-child{border-bottom:1px solid var(--line)}
.card.stack>.row.sp>span{font-weight:600!important}
/* options in setup: rows with a plate that fills when chosen */
.opts{gap:0;border-top:1px solid var(--line)}
.opt{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 46px 14px 0;position:relative}
.opt::after{content:"";position:absolute;right:4px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;border:2px solid var(--line2)}
.opt[aria-pressed="true"]{box-shadow:none}
.opt[aria-pressed="true"]::after{border:0;background:radial-gradient(circle,var(--bg) 0 4px,transparent 5px),linear-gradient(135deg,var(--red),var(--red2))}
.opt[aria-pressed="true"] b{color:var(--fg)}
div.opt::after{display:none}div.opt{padding-right:0}
/* stats: big stamped numbers, no boxes */
.stat3{gap:0}
.stat3>div{background:none;border-radius:0;padding:0}
.stat3 b{font-size:48px;font-weight:800;line-height:.9}
.stat3 span{letter-spacing:0;text-transform:none;font-size:13px;font-weight:600}
.kv b{font-size:44px;line-height:.9;font-weight:800}
.kv .eyebrow{font-size:13px}
.tbl th{letter-spacing:0;text-transform:none;font-size:12.5px}
/* sheets */
#sheet .pan{border-radius:28px 28px 0 0;border:0;padding-top:12px;background:var(--surf)}
#sheet .pan::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
#sheet .pan h2{font-size:34px}
/* toast */
#toast{border-radius:999px;padding:11px 18px}
/* charts */
.ch .a1{opacity:.18}.ch .g{stroke:var(--line)}
/* badges: plates */
.bdg .disc{background:none;border:2px dashed var(--line2)}

const GUIDE={
bsq:['Set the bar at upper-chest height. Step under it so it sits on your upper back, not your neck.|Walk it out two or three steps. Feet shoulder-width, toes turned out slightly.|Brace your stomach, then sit down between your heels until your hips are level with or below your knees.|Drive up through your whole foot, keeping your chest up.','Knees track over your toes. Set the safety bars just below your bottom position when you train alone.'],
fsq:['Rest the bar on the front of your shoulders, close to your throat, elbows high.|Feet shoulder-width, toes slightly out.|Squat straight down, keeping your torso upright and elbows up.|Stand up through your whole foot.','Tight wrists? Cross your arms over the bar instead of using a full grip.'],
lpr:['Sit with your back flat on the pad, feet shoulder-width in the middle of the platform.|Release the safety and lower until your knees reach about 90 degrees.|Press back up through your heels without locking your knees.','Stop the depth just before your lower back peels off the seat.'],
gsq:['Hold a dumbbell or kettlebell upright against your chest, elbows pointing down.|Feet slightly wider than shoulder-width, toes out.|Sit down between your heels until your elbows brush the inside of your knees.|Stand back up, keeping the weight tight to your chest.','Pause for a second at the bottom if you lose your position.'],
bwsq:['Stand with feet shoulder-width, arms out in front for balance.|Sit back and down until your thighs are at least parallel to the floor.|Drive up through your heels to stand tall.','Take three seconds on the way down to make easy reps count.'],
dl:['Stand with the bar over the middle of your feet, feet hip-width.|Hinge down and grip the bar just outside your legs. Drop your hips until your shins touch it.|Brace, pull the slack out of the bar, then push the floor away and stand tall.|Lower by pushing your hips back, then bend your knees once the bar passes them.','Keep the bar dragging up your legs and your back flat. If your back rounds, the weight is too heavy.'],
rdl:['Stand holding the bar at hip height, feet hip-width, knees softly bent.|Push your hips back and slide the bar down your thighs, back flat.|Stop when you feel a strong stretch in your hamstrings, usually just below the knee.|Drive your hips forward to stand up.','Your knees barely move. It is a hip movement, not a squat.'],
hth:['Sit on the floor with your upper back against the side of a bench and the bar across your hips, with a pad.|Plant your feet hip-width so your shins are vertical at the top.|Drive through your heels and lift your hips until you are flat from shoulders to knees.|Squeeze your glutes for a second, then lower.','Tuck your chin and keep your ribs down so the work comes from your hips, not your lower back.'],
drdl:['Stand holding dumbbells in front of your thighs, knees softly bent.|Push your hips back and slide the dumbbells down your legs, back flat.|Stop when you feel a strong stretch in your hamstrings.|Drive your hips forward to stand up.','Keep the dumbbells close to your legs the whole way.'],
kbs:['Stand with feet a little wider than hips, kettlebell a foot in front of you.|Hinge, grab the handle and hike the bell back between your legs.|Snap your hips forward hard so the bell floats up to chest height.|Let it swing back down and go straight into the next rep.','Your arms only guide the bell. The power comes from your hips.'],
gbr:['Lie on your back, knees bent, feet flat and hip-width.|Push through your heels and lift your hips until you are straight from shoulders to knees.|Squeeze your glutes at the top for a second, then lower slowly.','Once 15 reps is easy, add a pause at the top or a weight on your hips.'],
bp:['Lie on the bench with your eyes under the bar, feet flat on the floor.|Grip slightly wider than shoulder-width, squeeze your shoulder blades together and unrack.|Lower the bar to your lower chest, elbows at about 45 degrees to your body.|Press back up to straight arms over your shoulders.','Always use safety arms or a spotter. Keep your bum on the bench and shoulder blades pinned back.'],
dbp:['Sit on the bench with dumbbells on your thighs, lie back and bring them to chest level.|Press them up over your chest, palms facing your feet.|Lower until they are level with your chest, elbows at about 45 degrees.|Press back up, bringing them close together at the top.','Lower under control. Dumbbells let you go slightly deeper than a barbell.'],
mcp:['Set the seat so the handles line up with the middle of your chest.|Grip the handles with your shoulder blades back against the pad.|Press forward until your arms are straight but not locked.|Return slowly until you feel a stretch across your chest.','Keep your shoulders down, away from your ears.'],
idp:['Set the bench to about 30 degrees. Sit back with a dumbbell on each thigh and bring them to your shoulders.|Press them up over your upper chest, palms facing your feet.|Lower until they are level with your upper chest, elbows at about 45 degrees.|Press back up.','A steeper bench shifts the work to your shoulders. Thirty degrees keeps it on your upper chest.'],
ibp:['Set the bench to about 30 degrees under a rack. Lie back with your eyes under the bar.|Grip slightly wider than shoulder-width and unrack.|Lower the bar to your upper chest, just below your collarbones.|Press back up over your shoulders.','Use safety arms. Expect to lift a bit less than on a flat bench.'],
dpp:['Put your feet on a bench and your hands on the floor, slightly wider than your shoulders.|Keep your body straight from head to heels.|Lower until your chest is close to the floor.|Push back up.','The higher your feet, the more it works your upper chest and shoulders.'],
ipp:['Put your hands on the edge of a bench, slightly wider than your shoulders.|Walk your feet back until your body is straight.|Lower your chest to the bench edge, then push back up.','A good way to build up to full push-ups. Lower the surface as you get stronger.'],
idf:['Set the bench to about 30 degrees and lie back with dumbbells above your chest, palms facing.|With elbows slightly bent, lower them out to the sides in a wide arc.|Stop at a stretch, then bring them back together.','Keep it light and controlled. It is a stretch exercise, not a heavy one.'],
dfp:['Lie on the floor with knees bent, a dumbbell in each hand, arms straight above your chest.|Lower until your upper arms touch the floor and pause briefly.|Press back up.','The floor limits the depth, which makes this kind to sore shoulders.'],
pu:['Hands slightly wider than shoulders, body straight from head to heels.|Lower until your chest is a fist from the floor, elbows at about 45 degrees.|Push the floor away back to straight arms.','Too hard? Put your hands on a bench. Too easy? Put your feet on it.'],
ohp:['Start with the bar on the front of your shoulders, grip just outside shoulder-width.|Squeeze your glutes and brace your stomach.|Press straight up, moving your head back to let the bar pass, then push your head through at the top.|Lower back to your shoulders under control.','No leaning back to finish a rep. If you need to, the weight is too heavy.'],
dsp:['Sit on a bench with back support, dumbbells at shoulder height, palms forward.|Press up until your arms are straight overhead.|Lower slowly back to shoulder height.','Keep your back against the pad and your ribs down.'],
msp:['Set the seat so the handles start at shoulder height.|Grip with your back flat against the pad.|Press up until your arms are straight but not locked.|Lower slowly.','Keep your shoulders down and your lower back on the pad.'],
kbp:['Hold a kettlebell at your shoulder with the bell resting on your forearm.|Brace your stomach and squeeze your glutes.|Press straight up until your arm is locked out, bicep by your ear.|Lower back to your shoulder.','Do all reps on one side, then switch. Start with your weaker arm.'],
ppu:['Start in a push-up, then walk your feet in so your hips are high and your body makes an upside-down V.|Bend your elbows and lower the top of your head towards the floor between your hands.|Press back up.','The more upright your body, the harder it gets. Put your feet on a bench to progress.'],
bbr:['Hold the bar overhand, hinge forward to about 45 degrees with knees slightly bent.|Let the bar hang at arm\'s length, back flat.|Pull it to your lower ribs, driving your elbows back.|Lower under control.','Keep your body still. If you are swinging, drop the weight.'],
dbr:['Put one knee and the same hand on a bench, back flat.|Hold the dumbbell at arm\'s length in your other hand.|Pull it towards your hip, elbow close to your body.|Lower until your arm is straight and you feel a stretch.','Think of pulling your elbow to your back pocket rather than lifting with your arm.'],
csr:['Sit with feet on the platform, knees slightly bent, holding the handle with straight arms.|Sit tall, then pull the handle to your stomach, squeezing your shoulder blades together.|Return slowly until your arms are straight.','Don\'t rock backwards to move the weight. Your body stays upright.'],
kbr:['Put one hand on a bench, back flat, kettlebell in your other hand.|Pull it towards your hip, elbow close to your body.|Lower until your arm is straight.','Keep your hips and shoulders square to the floor.'],
ivr:['Set a bar at hip height in a rack. Lie underneath and grip it overhand.|Keep your body straight from head to heels.|Pull your chest up to the bar, squeezing your shoulder blades.|Lower under control.','Bend your knees to make it easier, raise your feet to make it harder.'],
brw:['Anchor the band at chest height and hold an end in each hand.|Step back until the band is tight with your arms straight.|Pull your hands to your ribs, squeezing your shoulder blades together.|Return slowly.','Step further back to add resistance.'],
dwr:['Stand in a doorway and grip both sides of the frame at chest height.|Walk your feet forward and lean back until your arms are straight.|Pull your chest towards the frame, squeezing your shoulder blades.|Lower slowly.','Check the frame is solid. Walk your feet further forward to make it harder.'],
pup:['Hang from the bar, overhand grip slightly wider than shoulders.|Pull your shoulders down, then pull up until your chin clears the bar.|Lower all the way to straight arms.','Can\'t do one yet? Use a band, or jump up and lower yourself slowly over five seconds.'],
lpd:['Set the knee pad so your thighs are locked in. Grip slightly wider than shoulders.|Lean back slightly and pull the bar to your upper chest, driving your elbows down.|Let it rise slowly until your arms are straight.','Pull with your elbows, not your hands, and don\'t yank with your body.'],
chu:['Hang from the bar with palms facing you, hands shoulder-width.|Pull until your chin clears the bar.|Lower all the way to straight arms.','Slightly easier than pull-ups and works your biceps harder.'],
bpd:['Anchor a band high, above head height. Kneel facing it, an end in each hand.|Pull your hands down to your chest, driving your elbows to your sides.|Return slowly.','Move further from the anchor for more resistance.'],
bss:['Stand a stride in front of a bench and rest the top of your back foot on it.|Hold dumbbells by your sides.|Lower your back knee towards the floor until your front thigh is about parallel.|Drive up through your front heel.','Most of your weight stays on the front leg. Find your foot position with light sets first.'],
wlu:['Hold dumbbells at your sides and stand tall.|Step forward and lower until both knees are at about 90 degrees.|Push through your front foot and bring your back foot forward into the next step.','Each step counts as one rep.'],
stu:['Stand facing a bench holding dumbbells.|Put one whole foot on the bench.|Drive through that heel to stand on top without pushing off your back foot.|Step down slowly.','Use a box lower than knee height if a bench is too high.'],
rlu:['Stand tall with hands on hips.|Step one foot back and lower until both knees are at about 90 degrees.|Push through your front foot to return.','Reverse lunges are easier on the knees than forward lunges.'],
lcu:['Sit with the lower pad just above your heels and the thigh pad snug on your legs, knees in line with the pivot.|Curl your heels down and back under the seat.|Return slowly to straight legs.','Keep your back against the pad and don\'t let your hips lift.'],
srdl:['Hold a weight in one hand and stand on the opposite leg.|Hinge forward, letting your free leg extend behind you, back flat.|Lower until you feel a stretch in your standing hamstring.|Drive your hips forward to stand up.','Hold a wall with your free hand if balance is the limit.'],
sgb:['Lie on your back with one foot flat and the other leg straight.|Push through the planted heel and lift your hips.|Squeeze at the top, then lower slowly.','Keep your hips level. Don\'t let one side drop.'],
lex:['Sit with the pad on your lower shins and knees in line with the pivot.|Straighten your legs fully, squeezing your quads.|Lower slowly.','Pause for a second at the top to make lighter weights work harder.'],
wsit:['Lean your back on a wall and slide down until your thighs are parallel to the floor.|Keep your knees over your ankles.|Hold for the target time.','Breathe steadily and keep your hands off your thighs.'],
scr:['Stand on a step with the balls of your feet on the edge.|Lower your heels as far as you can.|Rise onto your toes as high as you can and pause.','Switch to one leg at a time when two legs gets easy.'],
dcr:['Hold dumbbells at your sides, balls of your feet on the edge of a step.|Lower your heels as far as you can.|Rise onto your toes as high as you can and pause.','Go slowly. Bouncing takes the work away from your calves.'],
mfl:['Set the seat so the handles are at chest height.|With a slight bend in your elbows, bring the handles together in front of your chest.|Return slowly until you feel a stretch across your chest.','Keep the elbow angle fixed. Think of hugging, not pressing.'],
dfl:['Lie on a bench with dumbbells above your chest, palms facing each other.|With elbows slightly bent, lower them out to the sides in a wide arc.|Stop at a stretch, then bring them back together.','Go lighter than you think. Your shoulders take the strain if it is too heavy.'],
cfl:['Set both pulleys at shoulder height and stand between them, a handle in each hand.|Step forward with a slight bend in your elbows.|Bring your hands together in front of your chest.|Return slowly.','Keep a slight bend in your elbows the whole time.'],
lra:['Stand holding dumbbells at your sides.|With a slight bend in your elbows, raise them out to the sides to shoulder height.|Lower slowly.','Lead with your elbows and stop at shoulder height. No swinging.'],
fcp:['Set a rope at face height and grip it with your thumbs pointing back.|Pull the rope towards your face, splitting the ends beside your ears.|Return slowly.','Finish with your hands higher than your elbows.'],
rdf:['Hinge forward with a flat back, dumbbells hanging below your chest.|With elbows slightly bent, raise them out to the sides.|Squeeze your shoulder blades, then lower.','Use light weights and feel it in the back of your shoulders.'],
bpa:['Hold a band in front of your chest with straight arms, hands shoulder-width.|Pull the band apart until it touches your chest.|Return slowly.','Narrow your grip to make it harder.'],
dcu:['Stand holding dumbbells at your sides, palms forward.|Curl them up towards your shoulders, elbows fixed at your sides.|Lower slowly to straight arms.','No swinging. If your elbows drift forward, the weight is too heavy.'],
bcu:['Stand holding the bar with palms forward, hands shoulder-width.|Curl it up towards your shoulders, elbows fixed at your sides.|Lower slowly to straight arms.','Keep your body still and your elbows pinned.'],
ccu:['Set a bar or handle on a low pulley, palms facing up.|Curl it towards your shoulders, elbows at your sides.|Lower slowly.','The cable keeps tension on all the way down, so control the lowering.'],
hcu:['Stand holding dumbbells at your sides, palms facing each other.|Curl them up towards your shoulders, keeping the palms facing in.|Lower slowly.','Works your forearms as well as your biceps.'],
bdc:['Stand on the middle of a band, an end in each hand.|Curl your hands towards your shoulders, elbows at your sides.|Lower slowly.','Widen your stance on the band to add resistance.'],
tpd:['Set a bar or rope at the top of a cable and grip it with elbows tucked at your sides.|Push down until your arms are straight.|Let it rise slowly until your forearms are just above parallel.','Your elbows stay pinned. Only your forearms move.'],
ote:['Hold one dumbbell with both hands above your head.|Lower it behind your head by bending your elbows.|Straighten your arms back up.','Keep your elbows pointing forward, not flared out.'],
skc:['Lie on a bench holding the bar above your chest with a narrow grip.|Bend your elbows to lower the bar towards your forehead.|Straighten your arms back up.','Keep your upper arms still and lower slowly.'],
bdp:['Sit on the edge of a bench with hands beside your hips, then slide off so your arms hold you up.|Lower until your elbows are at about 90 degrees.|Press back up.','Bend your knees to make it easier. Keep your back close to the bench.'],
dpu:['Get into a push-up with your hands together under your chest, forming a diamond.|Lower your chest to your hands, elbows close to your body.|Push back up.','Drop to your knees to make it easier.'],
plk:['Rest on your forearms and toes, elbows under your shoulders.|Hold your body in a straight line from head to heels.|Squeeze your glutes and brace your stomach for the target time.','Stop the set if your hips sag or your back aches.'],
dbg:['Lie on your back, arms pointing at the ceiling, knees bent at 90 degrees above your hips.|Press your lower back into the floor.|Slowly lower one arm and the opposite leg towards the floor, then return.|Alternate sides.','Your lower back stays on the floor. Shorten the reach if it lifts.'],
hkr:['Hang from a bar with straight arms.|Lift your knees towards your chest by curling your hips up.|Lower slowly without swinging.','Straighten your legs to make it harder.'],
ccr:['Kneel in front of a high cable holding a rope beside your head.|Crunch down by curling your ribs towards your hips.|Return slowly.','Your hips stay still. The movement is all in your spine.'],
spk:['Lie on your side and prop yourself on one forearm, elbow under your shoulder.|Lift your hips so your body is straight from head to feet.|Hold for the target time, then switch sides.','Bend your bottom knee to make it easier.']};
